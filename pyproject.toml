[project]
name = "max-k-cut"
version = "0.1.0"
description = "Characterization of QUBO reformulations for the max k-cut problem using QAOA"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Adrian Harkness", email = "adh323@lehigh.edu" }]
# cplex ships wheels only through 3.11; qiskit-aer 0.15.1 stops at 3.12.
requires-python = ">=3.9,<3.12"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    # Core
    "numpy>=1.26",
    "networkx>=3.2",
    "matplotlib>=3.9",
    "docplex>=2.28",
    "cplex>=22.1.2",
    # Qiskit (exact versions for compatibility)
    "qiskit==1.3.2",
    "qiskit-aer==0.15.1",
    "qiskit-algorithms==0.3.1",
    "qiskit-optimization==0.6.1",
    "qiskit-ibm-runtime==0.33.2",
]

[project.urls]
Paper = "https://arxiv.org/abs/2511.01108"

[dependency-groups]
# Installed by `uv sync` by default; not required to consume the library itself.
dev = [
    "jupyter",
    "ipykernel",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["max_k_cut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
