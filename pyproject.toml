[project]
name = "max-k-cut"
version = "0.1.0"
description = "Characterization of QUBO reformulations for the max k-cut problem using QAOA"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Adrian Harkness", email = "adh323@lehigh.edu" }]
# Floor: qiskit-ibm-runtime 0.44.1 requires >=3.10.
# Ceiling: cplex ships wheels only through 3.11.
requires-python = ">=3.10,<3.12"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    # Core
    "numpy>=1.26",
    "networkx>=3.2",
    "matplotlib>=3.9",
    "docplex>=2.28",
    "cplex>=22.1.2",
    # Qiskit (exact versions for compatibility)
    # qiskit-ibm-runtime >=0.40 is required for the "ibm_quantum_platform" channel; the
    # legacy "ibm_quantum"/"ibm_cloud" endpoints it replaced no longer authenticate.
    # That in turn requires qiskit >=1.4.1. Held below qiskit 2.x, which qiskit-algorithms
    # 0.3.1 and qiskit-optimization 0.6.1 predate; 0.44.1 is the last runtime release on 1.x.
    "qiskit>=1.4.1,<2",
    "qiskit-aer==0.15.1",
    "qiskit-algorithms==0.3.1",
    "qiskit-optimization==0.6.1",
    "qiskit-ibm-runtime==0.44.1",
]

[project.urls]
Paper = "https://arxiv.org/abs/2511.01108"

[dependency-groups]
# Installed by `uv sync` by default; not required to consume the library itself.
dev = [
    "jupyter",
    "ipykernel",
    "pytest>=8",
    "pylatexenc>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["max_k_cut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
